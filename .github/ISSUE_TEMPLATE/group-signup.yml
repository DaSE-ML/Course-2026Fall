name: 组队报名
description: 每组 4–5 人；提交后机器人自动分配组号（ML26-01 起）
title: "组队报名"
labels: ["组队报名"]
body:
  - type: markdown
    attributes:
      value: |
        **提交后机器人会自动为你们组分配仓库号（`ML26-01` ~ `ML26-25`）并在下方回帖确认，无需自己选号。**

        - 每组 **4–5 人**：可先提交占号，凑齐后**编辑本 issue** 更新名单，机器人自动重新确认；满 5 人封顶。
        - ⚠️ **只需 GitHub 用户名，不要填写真实姓名、学号等个人信息。**
        - 提交前请确认组内每位同学都已注册 GitHub，并能正常登录。
  - type: textarea
    id: members
    attributes:
      label: 全体成员 GitHub 用户名（含组长，每行一位）
      description: |
        格式：每行一个 `@github用户名`（第一行写组长）。
        用户名务必逐字核对（含大小写）：仓库权限按用户名开通，拼错会开通失败。
      placeholder: |
        @zhangsan
        @lisi
        @wangwu
    validations:
      required: true
