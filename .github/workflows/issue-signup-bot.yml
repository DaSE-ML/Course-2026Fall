name: issue-signup-bot

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: issue-signup-bot
  cancel-in-progress: false

jobs:
  assign:
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 自动分配组号并确认
        run: bash .github/scripts/signup-bot.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
