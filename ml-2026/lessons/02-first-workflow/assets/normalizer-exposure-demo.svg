<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">同一个手写数字在不同曝光下进行 L2 归一化</title>
  <desc id="desc">正常曝光的数字与像素值减半的欠曝光数字，经过 L2 Normalizer 后得到相同整体强度，同时保留笔画比例。</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#f8fafc"/>
      <path d="M18 0H0V18" fill="none" stroke="#d5dfe9" stroke-width="1"/>
    </pattern>
    <g id="digit">
      <rect width="144" height="144" rx="8" fill="url(#grid)" stroke="#8194aa" stroke-width="2"/>
      <path d="M72 20C42 20 35 40 43 56C50 69 61 72 72 72C83 72 94 69 101 56C109 40 102 20 72 20ZM72 72C52 72 37 85 37 105C37 126 53 137 72 137C91 137 107 126 107 105C107 85 92 72 72 72Z" fill="none" stroke="#174b87" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#23756c"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="20" fill="#fbfcfe"/>
  <text x="252" y="42" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#192b41">输入：同一数字，不同曝光</text>
  <text x="930" y="42" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#192b41">输出：L2 范数都等于 1</text>
  <g transform="translate(82 82)">
    <use href="#digit"/>
    <text x="72" y="176" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#174b87">正常曝光</text>
    <text x="72" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#52657a">像素 x</text>
  </g>
  <g transform="translate(282 82)">
    <use href="#digit" opacity="0.5"/>
    <text x="72" y="176" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#a14a22">欠曝光</text>
    <text x="72" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#52657a">像素 0.5x</text>
  </g>
  <path d="M474 154H700" stroke="#23756c" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="493" y="174" width="188" height="58" rx="29" fill="#edf7f4" stroke="#23756c" stroke-width="2"/>
  <text x="587" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#23756c">Normalizer</text>
  <text x="587" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#23756c">norm="l2"</text>
  <g transform="translate(742 82)">
    <use href="#digit"/>
    <text x="72" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#52657a">x / ||x||₂</text>
  </g>
  <g transform="translate(942 82)">
    <use href="#digit"/>
    <text x="72" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#52657a">0.5x / ||0.5x||₂</text>
  </g>
  <rect x="90" y="348" width="1020" height="52" rx="10" fill="#eef3fa"/>
  <text x="600" y="381" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#174b87">整体强度被统一，像素之间的相对比例保持不变</text>
</svg>
